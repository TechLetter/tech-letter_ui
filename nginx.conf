server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # 빌드 파일은 이름에 해시가 붙어 바뀌지 않는다. 없는 파일은 index.html로
  # 떨어뜨리지 않고 404를 준다 — 배포 전 코드가 남은 탭이 옛 청크를 부르면
  # HTML을 JS로 읽다 앱 전체가 멈췄다(main.jsx의 preloadError 처리와 짝).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 글 "쉽게 읽기" 상세. 원 블로그·검색 결과와 경쟁하지 않도록 검색엔진에서 뺀다
  # (백엔드 /api/v1/posts/{id}/explainer 응답에도 같은 헤더가 붙는다). SPA라 index.html로 떨어뜨린다.
  location /posts/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    # 마지막 인자가 "/index.html"(파일 아님)이면 nginx가 내부 리다이렉트로 location /
    # 를 다시 매칭해 위 add_header가 사라진다. =404를 마지막에 둬야 /index.html을
    # "파일"로 찾아 이 location 안에서 그대로 서빙한다(add_header 유지).
    try_files $uri /index.html =404;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
